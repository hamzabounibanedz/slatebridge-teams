name: Verify portfolio site
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      NEXTAUTH_SECRET: "isolated-build-only"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify the application
        run: |
          npm ci
          cp .env.example .env
          npx --no-install prisma generate
          npx --no-install next build
          npm start >/tmp/site.log 2>&1 &
          curl --retry 15 --retry-all-errors --retry-delay 1 -fsSL http://localhost:4002 -o /tmp/home || { tail -30 /tmp/site.log; exit 1; }
          grep -Fq "Slatebridge Teams" /tmp/home
